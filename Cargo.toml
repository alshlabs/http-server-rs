[package]
name = "http-server-rs"
version = "0.0.0-local"
edition = "2024"
description = "Simple, zero-configuration command-line static HTTP server."
license = "MIT"

[lints.rust]
elided_lifetimes_in_paths = "allow"
rust_2018_idioms = { priority = -1, level = "deny" }

[lints.clippy]
module_inception = "allow"
uninlined_format_args = "allow"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
colored = "3.1.1"
crossbeam = "0.8.5"
futures = "0.3.34"
handlebars = "6.4.4"
http = "1.5.0"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["http1", "client"] }
hyper-rustls = { version = "0.27", default-features = false, features = [
  "aws-lc-rs",
  "http1",
  "native-tokio",
  "tls12",
] }
hyper-util = { version = "0.1.21", features = [
  "server-graceful",
  "client",
  "client-legacy",
  "http1",
] }
mime_guess = "2.0.5"
normalize-path = "0.2.2"
notify-debouncer-full = "0.7.0"
pathdiff = "0.2.3"
regex = "1.13.1"
self_update = { version = "1.3.3", default-features = false, features = [
  "github",
  "reqwest",
  "rustls",
  "async",
  "archive-tar",
  "compression-tar-gz",
  "checksums",
] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
jsonc-parser = { version = "0.34", features = ["serde"] }
serde_qs = "1.1.3"
tokio = { version = "1.54.1", features = [
  "rt-multi-thread",
  "sync",
  "fs",
  "net",
  "signal",
  "macros"
] }
tokio-util = { version = "0.7.20", features = [
  "io",
  "io-util",
  "futures-util",
] }
brotli = "9.1.1"
urlencoding = "2.1.3"
base64 = "0.23.1"
subtle = "2.6.1"
swc_core = { version = "82.2.0", features = [
  "common",
  "common_sourcemap",
  "ecma_ast",
  "ecma_codegen",
  "ecma_helpers_inline",
  "ecma_parser",
  "ecma_parser_typescript",
  "ecma_transforms",
  "ecma_transforms_proposal",
  "ecma_transforms_react",
  "ecma_transforms_typescript",
] }
include_dir = "0.7.4"
grass = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
unix_mode = "0.1.4"

[profile.release]
opt-level = 3
debug = false
lto = true
strip = "debuginfo"
panic = 'unwind'
incremental = false
codegen-units = 1
rpath = false
